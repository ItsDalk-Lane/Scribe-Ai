name: Release artifacts

on:
    push:
        tags: ['*.*.*']

jobs:
    build-and-attest:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v6
              with:
                  node-version: '22.19.0'
                  cache: npm
            - name: Verify release version
              run: node scripts/check-release.mjs "$GITHUB_REF_NAME"
            - run: npm ci
            - run: npm run lint
            - run: npm test
            - run: npm run build:release
            - name: Check installer files and rebuild for comparison
              run: |
                  staging="$RUNNER_TEMP/scribe-ai-release"
                  mkdir -- "$staging"
                  cp -P -- main.js manifest.json styles.css "$staging/"
                  node --input-type=module -e 'import { releaseAssetDigests } from "./scripts/check-release.mjs"; releaseAssetDigests(process.argv[1], process.argv[2]);' "$staging" "$GITHUB_REF_NAME"
                  node esbuild.config.mjs production
                  for file in main.js manifest.json styles.css; do
                      cmp -- "$file" "$staging/$file"
                  done
            - name: Attest release files
              uses: actions/attest@v4
              with:
                  subject-path: |
                      ${{ runner.temp }}/scribe-ai-release/main.js
                      ${{ runner.temp }}/scribe-ai-release/manifest.json
                      ${{ runner.temp }}/scribe-ai-release/styles.css
            - name: Package release files
              uses: actions/upload-artifact@v7
              with:
                  name: scribe-ai-${{ github.ref_name }}-verified
                  path: |
                      ${{ runner.temp }}/scribe-ai-release/main.js
                      ${{ runner.temp }}/scribe-ai-release/manifest.json
                      ${{ runner.temp }}/scribe-ai-release/styles.css
                  if-no-files-found: error
